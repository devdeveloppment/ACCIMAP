{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
    <div class="card shadow-sm text-center"><div class="card-body p-4 p-md-5">
      <span class="badge text-bg-secondary mb-3">Bientôt disponible · Phase {{ phase }}</span>
      <h1 class="h3">{{ title }}</h1>
      <p class="text-muted">{{ description }}</p>
      <a href="{% url 'home' %}" class="btn btn-primary">Retour à l'accueil</a>
    </div></div>
  </div></div>
</div>
{% endblock %}
