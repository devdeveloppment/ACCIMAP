<section class="emergency-section container py-4" aria-labelledby="emergency-title">
  <div class="emergency-panel">
    <h2 class="h4 mb-3" id="emergency-title">{% icon "siren" size=22 css="me-2" %}Numéros d'urgence</h2>
    <div class="row row-cols-2 row-cols-lg-4 g-3">
      <div class="col">
        <div class="emergency-card emergency-police">
          <span>Police</span><strong>111</strong>
        </div>
      </div>
      <div class="col">
        <div class="emergency-card emergency-fire">
          <span>Pompiers</span><strong>185</strong>
        </div>
      </div>
      <div class="col">
        <div class="emergency-card emergency-samu">
          <span>SAMU</span><strong>144</strong>
        </div>
      </div>
      <div class="col">
        <div class="emergency-card emergency-general">
          <span>Urgences</span><strong>112</strong>
        </div>
      </div>
    </div>
  </div>
</section>
