<section class="emergency-section container py-4" aria-labelledby="emergency-title">
  <div class="emergency-panel">
    <h2 class="h4 mb-3" id="emergency-title">{% icon "siren" size=22 css="me-2" %}Numéros d'urgence</h2>
    <div class="row row-cols-2 row-cols-lg-4 g-3">
      <div class="col">
        <a class="emergency-card emergency-police" href="tel:111" aria-label="Appeler la Police au 111">
          <span>Police</span><strong>111</strong>
        </a>
      </div>
      <div class="col">
        <a class="emergency-card emergency-fire" href="tel:185" aria-label="Appeler les Pompiers au 185">
          <span>Pompiers</span><strong>185</strong>
        </a>
      </div>
      <div class="col">
        <a class="emergency-card emergency-samu" href="tel:144" aria-label="Appeler le SAMU au 144">
          <span>SAMU</span><strong>144</strong>
        </a>
      </div>
      <div class="col">
        <a class="emergency-card emergency-general" href="tel:112" aria-label="Appeler les urgences au 112">
          <span>Urgences</span><strong>112</strong>
        </a>
      </div>
    </div>
  </div>
</section>
