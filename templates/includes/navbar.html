{% with current=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg navbar-dark accimap-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      {% include "includes/logo.html" %}<span class="fw-bold">ACCIMAP</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Ouvrir le menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link {% if current == 'home' %}active{% endif %}" href="{% url 'home' %}">Accueil</a></li>
        <li class="nav-item"><a class="nav-link {% if current == 'public_map' %}active{% endif %}" href="{% url 'maps:public_map' %}">Carte</a></li>
        <li class="nav-item"><a class="nav-link {% if current == 'about' %}active{% endif %}" href="{% url 'about' %}">À propos</a></li>
        <li class="nav-item"><a class="nav-link {% if current == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a></li>
        <li class="nav-item"><a class="nav-link {% if current == 'create' or current == 'anonymous_create' %}active{% endif %}" href="{% url 'reports:create' %}">Signaler un accident</a></li>
      </ul>
    </div>
  </div>
</nav>
{% endwith %}
